<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saturation Feed</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <h1>Saturation&nbsp;Feed</h1>
        <span class="game" id="game">connecting…</span>
      </div>
      <div class="bar-right" id="stats"></div>
    </header>

    <nav class="controls">
      <div class="chips" id="filters">
        <button class="chip is-on" data-filter="all">All</button>
        <button class="chip" data-filter="fresh">Fresh</button>
        <button class="chip" data-filter="warm">Warm</button>
        <button class="chip" data-filter="flooded">Flooded</button>
      </div>
      <div class="controls-right">
        <label class="toggle" title="Also render a 9:16 copy for Shorts/TikTok">
          <input type="checkbox" id="vertical" />
          9:16 copy
        </label>
        <label class="sort">
          Sort
          <select id="sort">
            <option value="opportunity">Opportunity</option>
            <option value="newest">Newest</option>
            <option value="saturation">Most clipped</option>
            <option value="chat">Chat spike</option>
          </select>
        </label>
      </div>
    </nav>

    <main id="feed" class="feed"></main>

    <template id="card-template">
      <article class="card">
        <div class="sat">
          <span class="sat-count"></span>
          <span class="sat-label">clippers</span>
        </div>
        <div class="body">
          <div class="row-top">
            <span class="state"></span>
            <a class="broadcaster" target="_blank" rel="noopener"></a>
            <span class="new-clips"></span>
          </div>
          <p class="title"></p>
          <div class="meta"></div>
          <div class="clip-status" hidden></div>
        </div>
        <div class="actions">
          <a class="open" target="_blank" rel="noopener">Open at moment</a>
          <button class="clip" type="button">Clip it</button>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
